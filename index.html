<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>東京富士山旅遊</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #34495e;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    nav button:hover {
      background: #1abc9c;
    }

    .content {
      padding: 20px;
      max-width: 800px;
      margin: auto;
      background: white;
    }

    .section {
      display: none;
    }

    .active {
      display: block;
    }

    /* 住宿卡片樣式 */
    .hotel-card {
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
      background: #fafafa;
    }

    .hotel-img {
      width: 100%;
      max-height: 350px;
      object-fit: cover;
      border-radius: 6px;
      margin-top: 10px;
    }

    .hotel-link {
      display: inline-block;
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 14px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .hotel-link:hover {
      background: #2980b9;
    }
  </style>
</head>

<body>

<header>
  <h1> 我的旅遊行程</h1>
</header>

<nav>
  <button onclick="showSection('rules')">旅遊公約</button>
  <button onclick="showSection('hotel')">住宿地點</button>
  <button onclick="showSection('day1')">Day 1 第一天</button>
  <button onclick="showSection('day2')">Day 2 第二天</button>
  <button onclick="showSection('day3')">Day 3 第三天</button>
  <button onclick="showSection('day4')">Day 4 第四天</button>
  <button onclick="showSection('day5')">Day 5 第五天</button>
  <button onclick="showSection('transport')">行前通知</button>
</nav>

<div class="content">

  <div id="hotel" class="section active">
    <h2>住宿地點</h2>
    
    <div class="hotel-card">
      <h3>淺草中央酒店 (Asakusa Central Hotel)</h3>
      <div>
        <!-- 網站連結 -->
        <a class="hotel-link" style="background:#27ae60;" href="https://www.pelican.co.jp/asakusacentralhotel/index.html" target="_blank">飯店連結</a>
      </div>
      <!-- 照片位置：放網路圖片網址，或你資料夾裡的圖片檔名 (例如 hotel1.jpg) -->
      <img class="hotel-png" src="image/hotel_outside.png" alt="飯店外觀">
      <img class="hotel-png" src="image/hotel_room.png" alt="飯店客房">
      <img class="hotel-png" src="image/hotel_breakfast.png" alt="飯店早餐">
      <img class="hotel-png" src="image/hotel_address.png" alt="飯店位置">
      <!-- <div> -->
        <!-- 網站連結 -->
        <!-- <a class="hotel-link" style="background:#27ae60;" href="https://www.pelican.co.jp/asakusacentralhotel/index.html" target="_blank">飯店連結</a>
      </div> -->
    </div>
  </div>

  <!-- <div id="day1" class="section active">
    <h2>Day 1 - 抵達</h2>
    <ul>
      <li>抵達機場</li>
      <li>前往飯店</li>
      <li>晚餐：居酒屋</li>
    </ul>
  </div> -->

  <div id="day2" class="section">
    <h2>Day 2 - 市區觀光</h2>
    <ul>
      <li>淺草寺</li>
      <li>晴空塔</li>
      <li>秋葉原</li>
    </ul>
  </div>

  <div id="transport" class="section">
    <h2>交通方式</h2>
    <ul>
      <li>成田機場 → 東京：NEX 或巴士</li>
      <li>市內：地鐵為主</li>
    </ul>
  </div>

</div>

<script>
  function showSection(id) {
    let sections = document.querySelectorAll('.section');
    sections.forEach(sec => sec.classList.remove('active'));

    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
