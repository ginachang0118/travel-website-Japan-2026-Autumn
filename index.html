<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>東京富士山旅遊</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #34495e;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    nav button:hover {
      background: #1abc9c;
    }

    .content {
      padding: 20px;
      max-width: 800px;
      margin: auto;
      background: white;
    }

    .section {
      display: none;
    }

    .active {
      display: block;
    }

    /* 住宿卡片樣式 */
    /* 統一設定圖片的寬高與裁切 */
    .hotel-png {
      width: 100%;           /* 寬度撐滿容器 */
      height: 200px;         /* 固定一致的高度 */
      object-fit: cover;     /* 關鍵：保持比例填滿並自動裁切多餘邊緣，防止照片被壓扁或拉長 */
      border-radius: 6px;    /* 微圓角更美觀 */
      display: block;
    }

    /* 包含圖片與說明的容器排版 */
    .hotel-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); /* 自動並排，手機版自動換行 */
      gap: 15px;             /* 圖片之間的間隔 */
      margin-top: 15px;
    }

    .hotel-item {
      margin: 0;
      text-align: center;
    }

    .hotel-item figcaption {
      margin-top: 6px;
      font-size: 14px;
      color: #555;
      font-weight: bold;
    }
    

    .hotel-link {
      display: inline-block;
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 14px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .hotel-link:hover {
      background: #2980b9;
    }
  </style>
</head>

<body>

<header>
  <h1> 我的旅遊行程</h1>
</header>

<nav>
  <button onclick="showSection('rules')">旅遊公約</button>
  <button onclick="showSection('hotel')">住宿地點</button>
  <button onclick="showSection('day1')">Day 1 第一天</button>
  <button onclick="showSection('day2')">Day 2 第二天</button>
  <button onclick="showSection('day3')">Day 3 第三天</button>
  <button onclick="showSection('day4')">Day 4 第四天</button>
  <button onclick="showSection('day5')">Day 5 第五天</button>
  <button onclick="showSection('transport')">行前通知</button>
</nav>

<div class="content">

  <div id="hotel" class="section active">
    <h2>住宿地點</h2>
    
    <div class="hotel-gallery">
      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_outside.png" alt="飯店外觀">
        <figcaption>飯店外觀</figcaption>
      </figure>

      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_room.png" alt="飯店客房">
        <figcaption>飯店客房</figcaption>
      </figure>

      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_breakfast.png" alt="飯店早餐">
        <figcaption>飯店早餐</figcaption>
      </figure>

      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_address_map.png" alt="飯店位置">
        <figcaption>飯店位置</figcaption>
      </figure>
    </div>

    <div>
        <!-- 官網連結 -->
        <a class="hotel-link" style="background:#27ae60;" href="https://www.pelican.co.jp/asakusacentralhotel/index.html" target="_blank">飯店連結（請點我）</a>
      </div>

    </div>
  </div>

  

  <!-- <div id="day1" class="section active">
    <h2>Day 1 - 抵達</h2>
    <ul>
      <li>抵達機場</li>
      <li>前往飯店</li>
      <li>晚餐：居酒屋</li>
    </ul>
  </div> -->

  <div id="day2" class="section">
    <h2>Day 2 - 市區觀光</h2>
    <ul>
      <li>淺草寺</li>
      <li>晴空塔</li>
      <li>秋葉原</li>
    </ul>
  </div>

  <div id="transport" class="section">
    <h2>交通方式</h2>
    <ul>
      <li>成田機場 → 東京：NEX 或巴士</li>
      <li>市內：地鐵為主</li>
    </ul>
  </div>

</div>

<script>
  function showSection(id) {
    let sections = document.querySelectorAll('.section');
    sections.forEach(sec => sec.classList.remove('active'));

    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
