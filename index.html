<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>東京富士山旅遊</title>

  <style>
    body {
      font-family: Arial;
      margin: 0;
      background: #f5f5f5;
    }

    header {
      background: #2c3e50;
      color: white;
      padding: 15px;
      text-align: center;
    }

    nav {
      display: flex;
      justify-content: center;
      background: #34495e;
    }

    nav button {
      background: none;
      border: none;
      color: white;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 16px;
    }

    nav button:hover {
      background: #1abc9c;
    }

    .content {
      padding: 20px;
      max-width: 800px;
      margin: auto;
      background: white;
    }

    .section {
      display: none;
    }

    .active {
      display: block;
    }

    /* 住宿卡片樣式 */
    /* 統一設定圖片的寬高與裁切 */
    .hotel-png {
      width: 100%;           /* 寬度撐滿容器 */
      height: 200px;         /* 固定一致的高度 */
      object-fit: cover;     /* 關鍵：保持比例填滿並自動裁切多餘邊緣，防止照片被壓扁或拉長 */
      border-radius: 6px;    /* 微圓角更美觀 */
      display: block;
    }

    /* 包含圖片與說明的容器排版 */
    .hotel-gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); /* 自動並排，手機版自動換行 */
      gap: 15px;             /* 圖片之間的間隔 */
      margin-top: 15px;
    }

    .hotel-item {
      margin: 0;
      text-align: center;
    }

    .hotel-item figcaption {
      margin-top: 6px;
      font-size: 14px;
      color: #555;
      font-weight: bold;
    }
    

    .hotel-link {
      display: inline-block;
      margin-top: 10px;
      margin-right: 10px;
      padding: 8px 14px;
      background: #3498db;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      font-size: 14px;
    }

    .hotel-link:hover {
      background: #2980b9;
    }

    .spot-info h4 {
      margin: 0;
      font-size: 15px;
      font-weight: bold;      /* 景點名稱粗體 */
      color: #2c3e50;
    }

    .spot-desc {
      font-weight: normal;    /* 關鍵：取消粗體 */
      font-size: 13px;        /* 補充說明稍微小一點點，層次更好看 */
      color: #666;            /* 灰色字體 */
      margin-left: 8px;       /* 與前面景點名稱留一點間距 */
    }

    * 讓 4 個景點在同一排（4 等分） */
    .spot-gallery {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 關鍵：強制分成 4 欄排在同一排 */
      gap: 15px;                             /* 彼此間距 */
      margin-top: 15px;
    }

    .spot-item {
      margin: 0;
      text-align: center;                    /* 文字置中 */
    }

    /* 上方文字樣式：粗體標題 + 一般文字在同一行 */
    .spot-item figcaption {
      margin-bottom: 8px;                    /* 文字與下方照片的距離 */
      font-size: 13px;
      color: #333;
    }

    .spot-item figcaption strong {
      font-weight: bold;
    }

    .spot-item figcaption span {
      color: #666;
      font-size: 12px;
    }

    /* 下方圖片：跟飯店一樣強制統一大小、不變形 */
    .spot-png {
      width: 100%;
      height: 140px;                         /* 統一高度（可依喜好調整，如 150px） */
      object-fit: cover;                     /* 關鍵：填滿且不壓扁 */
      border-radius: 6px;
      display: block;
    }
  </style>
</head>

<body>

<header>
  <h1> 我的旅遊行程</h1>
</header>

<nav>
  <button onclick="showSection('rules')">旅遊公約</button>
  <button onclick="showSection('hotel')">住宿地點</button>
  <button onclick="showSection('day1')">Day 1 第一天</button>
  <button onclick="showSection('day2')">Day 2 第二天</button>
  <button onclick="showSection('day3')">Day 3 第三天</button>
  <button onclick="showSection('day4')">Day 4 第四天</button>
  <button onclick="showSection('day5')">Day 5 第五天</button>
  <button onclick="showSection('transport')">行前通知</button>
</nav>

<div class="content">

  <div id="hotel" class="section active">
    <h2>住宿地點</h2>
    
    <div class="hotel-gallery">
      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_outside.png" alt="飯店外觀">
        <figcaption>飯店外觀</figcaption>
      </figure>

      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_room.png" alt="客房">
        <figcaption>客房</figcaption>
      </figure>

      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_breakfast.png" alt="早餐">
        <figcaption>早餐</figcaption>
      </figure>

      <figure class="hotel-item">
        <img class="hotel-png" src="image/hotel_address_map.png" alt="地理位置">
        <figcaption>地理位置</figcaption>
      </figure>
    </div>

    <div>
      <!-- 官網連結 -->
      <a class="hotel-link" style="background:#27ae60;" href="https://www.pelican.co.jp/asakusacentralhotel/index.html" target="_blank">飯店連結（請點我）</a>
    </div>

    <!-- 新增：周邊景點區塊 -->
    <div class="nearby-spots" style="margin-top: 30px; border-top: 1px solid #e0e0e0; padding-top: 20px;">
    <h3>📍 飯店周邊景點</h3>

    <!-- 沿用類似 hotel-gallery 的容器 -->
    <div class="spot-gallery">

      <figure class="spot-item">
        <figcaption><strong>淺草寺 / 雷門</strong> <span>步行約 3-5 分鐘</span></figcaption>
        <img class="spot-png" src="/image/hotel_spot_lemon.png" alt="淺草寺雷門">
      </figure>

      <figure class="spot-item">
        <figcaption><strong>仲見世商店街</strong> <span>步行約 3 分鐘</span></figcaption>
        <img class="spot-png" src="image/hotel_spot_shopping_street.png" alt="仲見世商店街">
      </figure>

      <figure class="spot-item">
        <figcaption><strong>東京晴空塔</strong> <span>車程約 10 分鐘</span></figcaption>
        <img class="spot-png" src="image/spot_skytree.png" alt="東京晴空塔">
      </figure>

      <figure class="spot-item">
        <figcaption><strong>隅田公園</strong> <span>步行約 8 分鐘</span></figcaption>
        <img class="spot-png" src="image/spot_sumida.png" alt="隅田公園">
      </figure>
  

    </div>
  </div>

  

  <!-- <div id="day1" class="section active">
    <h2>Day 1 - 抵達</h2>
    <ul>
      <li>抵達機場</li>
      <li>前往飯店</li>
      <li>晚餐：居酒屋</li>
    </ul>
  </div> -->

  <div id="day2" class="section">
    <h2>Day 2 - 市區觀光</h2>
    <ul>
      <li>淺草寺</li>
      <li>晴空塔</li>
      <li>秋葉原</li>
    </ul>
  </div>

  <div id="transport" class="section">
    <h2>交通方式</h2>
    <ul>
      <li>成田機場 → 東京：NEX 或巴士</li>
      <li>市內：地鐵為主</li>
    </ul>
  </div>

</div>

<script>
  function showSection(id) {
    let sections = document.querySelectorAll('.section');
    sections.forEach(sec => sec.classList.remove('active'));

    document.getElementById(id).classList.add('active');
  }
</script>

</body>
</html>
